# Fly.io config for a self-hosted hive-relay. Deploy from this repo root:
#   fly launch --copy-config --no-deploy   # pick app name / region
#   fly deploy
# Fly terminates TLS at its edge and forwards 443 → internal_port (8443), giving
# you an https://<app>.fly.dev URL to point the client at.

app = "hive-relay"          # `fly launch` offers to pick a unique name
primary_region = "iad"      # change to one near your users (e.g. lhr, fra, sjc)

[build]
  # Resolved relative to this config's dir (deploy/); the Dockerfile lives at the
  # repo root. Deploy from the repo root: `fly deploy . --config deploy/fly.toml`.
  dockerfile = "../Dockerfile"

[env]
  # In-memory + JSON snapshot on the volume below (single instance). For HA, set
  # DATABASE_URL to a shared Postgres as a secret (`fly secrets set DATABASE_URL=…`)
  # and remove this + the mount — DATABASE_URL takes precedence, and you can then
  # raise min_machines_running.
  HIVE_RELAY_DATA_DIR = "/data"

# Persistent volume for the snapshot store. Create once before first deploy:
#   fly volumes create hive_data --size 1 --region <primary_region>
[[mounts]]
  source = "hive_data"
  destination = "/data"

[http_service]
  internal_port = 8443
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1  # snapshot store = single instance; use Postgres to scale out

  # Per-machine connection concurrency limits: shed load (and trigger autoscaling
  # where configured) before a single machine is buried. Generous for a poll/SSE
  # relay; long-lived SSE streams are additionally capped in-process (HIVE_RELAY_MAX_SSE).
  [http_service.concurrency]
    type = "requests"
    soft_limit = 400
    hard_limit = 500

[[http_service.http_checks]]
  method = "get"
  path = "/v1/health"
  interval = "15s"
  timeout = "2s"
  grace_period = "5s"

[[vm]]
  size = "shared-cpu-1x"
  # 512MB headroom: the snapshot / in-memory store holds recent E2EE traffic + the
  # social graph in RAM. The public prod app runs on Postgres (DATABASE_URL secret)
  # and sets HIVE_RELAY_REQUIRE_DB=1 so it never silently falls back to the
  # ephemeral in-memory store (see buildStore / deploy.yml).
  memory = "512mb"
